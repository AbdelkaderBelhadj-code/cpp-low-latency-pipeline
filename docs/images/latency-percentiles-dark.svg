<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title id="title">Latency at every percentile: lock-free vs mutex queue</title><desc id="desc">Line chart of latency versus percentile. The lock-free SPSC queue stays near 100 ns up to p99 (p50 75 ns, p99 116 ns); the mutex queue sits around 5 µs (p50 5.3 µs, p99 59.9 µs). Both have tails that reach hundreds of microseconds to milliseconds beyond p99.9.</desc><rect x="0.5" y="0.5" width="819" height="469" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><text x="28" y="38" font-size="17" font-weight="600" fill="#ffffff">Latency at every percentile: lock-free vs mutex queue</text><text x="28" y="61" font-size="13" fill="#c3c2b7">100,000 ticks per queue, one every 5 µs · lower is better · log scale</text><line x1="28.0" y1="88.0" x2="46.0" y2="88.0" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/><text x="52.0" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">SpscQueue · lock-free ring buffer</text><line x1="295.8" y1="88.0" x2="313.8" y2="88.0" stroke="#d95926" stroke-width="2" stroke-linecap="round"/><text x="319.8" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">MutexQueue · mutex + condition variable</text><line x1="92.0" y1="408.5" x2="700.0" y2="408.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="412.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">10 ns</text><line x1="92.0" y1="359.5" x2="700.0" y2="359.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="363.7" font-size="11" fill="#898781" text-anchor="end" font-weight="400">100 ns</text><line x1="92.0" y1="311.5" x2="700.0" y2="311.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="315.3" font-size="11" fill="#898781" text-anchor="end" font-weight="400">1 µs</text><line x1="92.0" y1="263.5" x2="700.0" y2="263.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="267.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">10 µs</text><line x1="92.0" y1="214.5" x2="700.0" y2="214.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="218.7" font-size="11" fill="#898781" text-anchor="end" font-weight="400">100 µs</text><line x1="92.0" y1="166.5" x2="700.0" y2="166.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="170.3" font-size="11" fill="#898781" text-anchor="end" font-weight="400">1 ms</text><line x1="92.0" y1="118.5" x2="700.0" y2="118.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="122.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">10 ms</text><text x="98.5" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p50</text><text x="187.0" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p90</text><text x="313.7" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p99</text><text x="440.3" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p99.9</text><text x="567.0" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p99.99</text><text x="693.7" y="430.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">p99.999</text><text x="396.0" y="452.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">percentile  (each step to the right adds one more “9”)</text><path d="M98.5,365.7 L101.0,365.2 L103.5,364.9 L106.1,364.6 L108.6,364.4 L111.1,364.1 L113.7,363.8 L116.2,363.6 L118.7,363.3 L121.3,363.1 L123.8,362.8 L126.3,362.6 L128.9,362.6 L131.4,362.4 L133.9,362.1 L136.5,361.9 L139.0,361.6 L141.5,361.6 L144.1,361.4 L146.6,361.2 L149.1,361.2 L151.7,361.0 L154.2,360.7 L156.7,360.7 L159.3