name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux · GCC", os: ubuntu-latest }
          - { name: "Windows · MSVC", os: windows-latest }
          - { name: "macOS · Clang (ARM64)", os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke run (20,000 ticks per queue)
        shell: bash
        run: |
          exe=build/latency_pipeline
          if [ -f build/Release/latency_pipeline.exe ]; then exe=build/Release/latency_pipeline.exe; fi
          "$exe" 20000 5000 latencies.csv

  thread-sanitizer:
    name: Linux · ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Allow TSan's memory layout
        # recent kernels use more ASLR bits than some TSan runtimes accept
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build the unit tests with -fsanitize=thread
        run: clang++ -std=c++17 -O1 -g -fsanitize=thread -Iinclude tests/unit_tests.cpp -o unit_tests_tsan
      - name: Run (fails on any data race)
        run: ./unit_tests_tsan
